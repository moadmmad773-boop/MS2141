<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة السيارة</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding-top: 50px; }
    .pin-box { font-size: 40px; font-weight: bold; letter-spacing: 5px; color: #00ffcc; margin: 20px 0; }
    .status { font-size: 18px; color: #aaa; }
  </style>
</head>
<body>

  <h1>شاشة الكامري</h1>
  <p class="status">رمز الاقتران الخاص بك:</p>
  <div id="pinDisplay" class="pin-box">جاري الجلب...</div>

  <script>
    // الاتصال التلقائي بنفس السيرفر المستضيف
    const socket = io();

    // تسجيل الشاشة واستلام الـ PIN
    socket.emit('registerScreen');

    socket.on('screenRegistered', (data) => {
      document.getElementById('pinDisplay').innerText = data.pin;
    });

    // استقبال الأوامر القادمة من الريموت
    socket.on('stateUpdate', (data) => {
      console.log('تم استقبال حالة جديدة:', data);
    });

    socket.on('remoteNavigate', (dir) => {
      console.log('تم استقبال أمر توجيه:', dir);
    });
  </script>
</body>
</html>
